<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPU TOWER - SAFE TOKEN</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{padding:10px;text-align:center;border-bottom:3px solid gold;position:sticky;top:0;background:#000;z-index:99}
#ticker{display:flex;gap:6px;overflow-x:auto;padding:5px}
.tick{background:#111;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:13px;white-space:nowrap;color:#0f0}
#ltp{font-size:26px;color:#00ff00;font-weight:bold;margin:5px}
.signal{padding:12px;border-radius:8px;font-weight:bold;text-align:center;margin:6px}
.BUY{background:#00c853;color:#000}.SELL{background:#ff1744;color:#fff}.WAIT{background:#222;color:#aaa}
#chart{height:450px}
.box{margin:8px;padding:12px;background:#111;border:1px solid #333;border-radius:10px}
input,select{width:100%;padding:12px;background:#000;color:#0f0;border:1px solid gold;border-radius:6px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:gold;color:#000;font-weight:bold;border:none;border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
<div style="color:gold;font-weight:bold">WORLD NO.1 TOPU TOWER - SAFE</div>
<div id="ticker">TOKEN DALO - LIVE START HOGA</div>
<div id="ltp">READY TO START ✓</div>
<div id="signal" class="signal WAIT">WAIT - TOKEN KA INTEZAR</div>
</div>

<!-- YEH RAHA BAHAR WALA TOKEN BOX - SAFE -->
<div class="box" style="border:2px solid gold">
<div style="color:gold;font-weight:bold;margin-bottom:6px">🔐 TOKEN DASHBOARD - YAHAN PASTE KARO (SAFE)</div>
<input id="tokenInput" type="text" placeholder="eyJ... wala token yahan paste karo">
<button class="btn" onclick="saveToken()">SAVE & RUN LIVE</button>
<button class="btn" style="background:#222;color:#fff" onclick="clearToken()">TOKEN HATAO / LOGOUT</button>
<div style="font-size:10px;color:#888;margin-top:6px">Token sirf tere mobile me save hoga, code me nahi jayega. 100% Safe.</div>
</div>

<div class="box">
<select id="mainSel">
<option value="BSE_INDEX|SENSEX">SENSEX</option>
<option value="NSE_INDEX|Nifty 50">NIFTY 50</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY</option>
<option value="NSE_EQ|INE040A01034">HDFC BANK</option>
<option value="NSE_EQ|INE002A01018">RELIANCE</option>
</select>
<div style="display:flex;gap:6px;margin-top:6px">
<select id="intervalSel"><option value="1minute">1M</option><option value="5minute" selected>5M</option></select>
<button onclick="loadChart()" style="flex:1;background:gold;border:none;border-radius:6px;font-weight:bold">LOAD CHART</button>
</div>
</div>

<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('TOPU_TOKEN')||'';
document.getElementById('tokenInput').value=TOKEN;
let chart,candleSeries;

function saveToken(){
 let t=document.getElementById('tokenInput').value.trim();
 if(t.length<20){alert('Sahi token paste kar!');return;}
 localStorage.setItem('TOPU_TOKEN',t);
 TOKEN=t;
 alert('TOKEN SAVE HO GAYA! AB LIVE CHALEGA');
 location.reload();
}
function clearToken(){
 localStorage.removeItem('TOPU_TOKEN');
 document.getElementById('tokenInput').value='';
 alert('TOKEN HATA DIYA');
 location.reload();
}

function init(){
 chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}}});
 candleSeries=chart.addCandlestickSeries({upColor:'#00ff00',downColor:'#ff1744'});
 if(TOKEN){
   fetchAll();
   setInterval(fetchAll,2000);
   loadChart();
 } else {
   document.getElementById('ltp').innerText='TOKEN DALO UPAR BOX ME';
 }
}

async function fetchAll(){
 let ALL="BSE_INDEX|SENSEX,NSE_INDEX|Nifty 50,NSE_INDEX|Nifty Bank";
 try{
  let url=`https://api.upstox.com/v2/market-quote/ltp?instrument_key=${encodeURIComponent(ALL)}`;
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.status==='success'){
   let html='';
   for(let k in j.data){
    let p=j.data[k].last_price;
    let name=k.includes('SENSEX')?'SENSEX':k.includes('Bank')?'BANK':k.includes('50')?'NIFTY':k;
    html+=`<div class="tick">${name} ${p} LIVE ✓</div>`;
   }
   document.getElementById('ticker').innerHTML=html;
   document.getElementById('ltp').innerText='LIVE CONNECTED ✓';
  } else {
   document.getElementById('ltp').innerText='TOKEN EXPIRE - NAYA DALO';
  }
 }catch(e){}
}

async function loadChart(){
 if(!TOKEN){alert('Pehle upar token paste kar!');return;}
 let inst=document.getElementById('mainSel').value;
 let interval=document.getElementById('intervalSel').value;
 let to=new Date().toISOString().split('T')[0];
 let from=new Date(Date.now()-7*24*3600*1000).toISOString().split('T')[0];
 let url=`https://api.upstox.com/v2/historical-candle/${encodeURIComponent(inst)}/${interval}/${to}/${from}`;
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data && j.data.candles){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData(data);
   let last=data[data.length-1];
   let sig=document.getElementById('signal');
   if(last.close>last.open){sig.className='signal BUY';sig.innerText='🚀 BUY LIVE - '+inst.split('|').pop();}
   else{sig.className='signal SELL';sig.innerText='🔻 SELL LIVE - '+inst.split('|').pop();}
  }
 }catch(e){}
}

init();
</script>
</body>
</html>
