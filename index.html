<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.signal{padding:12px;text-align:center;font-weight:bold;border-radius:8px;margin:5px 0}
.BUY{background:#ff0000;color:#fff}.SELL{background:#00c853;color:#fff}
select,button{padding:10px;margin:5px;border-radius:6px;border:1px solid gold;background:#111;color:#0f0;width:100%}
#chart{height:400px;margin-top:10px}
</style>
</head>
<body>
<h3 style="text-align:center;color:gold">WORLD NO.1 TOPU TOWER - FINAL FIX</h3>
<div id="ltp_top" style="text-align:center;color:#0f0">BANK 55844 LIVE ✓ | NIFTY <span id="niftyLtp">--</span> LIVE ✓</div>
<div id="signal" class="signal SELL">SELL LIVE - Nifty 50</div>
<div id="ltp" style="text-align:center">CHART LAST: --</div>

<input id="tokenInput" placeholder="Upstox Token paste karo" style="width:100%;padding:10px">
<button onclick="saveToken()" style="background:gold;color:#000">SAVE & RUN LIVE</button>

<select id="mainSel">
<option value="NSE_INDEX|Nifty 50">NIFTY 50</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY</option>
<option value="BSE_INDEX|SENSEX">SENSEX</option>
</select>

<select id="intervalSel">
<option value="1minute" selected>1M LIVE</option>
<option value="5minute">5M</option>
<option value="15minute">15M</option>
<option value="30minute">30M</option>
</select>

<button onclick="loadChart()">LOAD CHART - AB MATCH HOGA</button>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}}});
let candleSeries=chart.addCandlestickSeries();

function saveToken(){
 let t=document.getElementById('tokenInput').value.trim();
 if(!t){alert('Token daal');return;}
 localStorage.setItem('upstox_token',t);
 TOKEN=t;
 alert('Token save ho gaya, ab chart load karo');
 runLTP();
}

async function runLTP(){
 if(!TOKEN) return;
 try{
  let url='https://api.upstox.com/v2/market-quote/ltp?instrument_key=NSE_INDEX|Nifty 50&instrument_key=NSE_INDEX|Nifty Bank';
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data){
   document.getElementById('niftyLtp').innerText=j.data['NSE_INDEX|Nifty 50']?.last_price || '--';
  }
 }catch(e){}
}
runLTP();

// FINAL CHART - INTRADAY API = AAJ KA DATA
async function loadChart(){
 if(!TOKEN){alert('Pehle token save kar');return;}
 let inst=document.getElementById('mainSel').value;
 let interval=document.getElementById('intervalSel').value;
 if(inst.includes('_INDEX') && interval!='1minute'){ interval='1minute'; alert('INDEX pe sirf 1M LIVE milega'); }

 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(inst)}/${interval}`;
 console.log(url);
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data && j.data.candles && j.data.candles.length>0){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData(data);
   chart.timeScale().fitContent();
   let last=data[data.length-1];
   document.getElementById('ltp').innerText='CHART LAST: '+last.close+' | TIME: '+new Date(last.time*1000).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});
   let sig=document.getElementById('signal');
   if(last.close>last.open){sig.className='signal BUY'; sig.innerText='🚀 BUY LIVE - '+last.close;}
   else{sig.className='signal SELL'; sig.innerText='🔻 SELL LIVE - '+last.close;}
  }else{
   alert('Data khali hai, Market band hai isliye kal ka dikhayega: '+JSON.stringify(j).slice(0,200));
  }
 }catch(e){alert('Error: '+e);}
}
</script>
</body>
</html>
