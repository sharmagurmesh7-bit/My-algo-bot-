<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - CONNECTED FIX</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.header{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px;font-weight:bold}
.ltp-bar{text-align:center;color:#00ff88;border:1px solid #333;padding:8px;border-radius:8px;margin-top:5px}
.signal{padding:12px;text-align:center;font-weight:bold;border-radius:8px;margin:8px 0}
.BUY{background:red}.SELL{background:#00c853}
#conn{padding:10px;text-align:center;border-radius:8px;margin:5px 0;background:#222;color:orange;font-weight:bold}
#conn.ok{background:#00c853;color:#fff}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;box-sizing:border-box}
input,select{background:#111;color:#fff;border:1px solid gold}
button{background:gold;color:#000;font-weight:bold;border:none;cursor:pointer;font-size:16px}
#chart{height:400px;border:1px solid #222;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="header">🚀 WORLD NO.1 TOPU TOWER - CONNECTED FIX</div>
<div id="conn">🔴 NOT CONNECTED - Token Save Karo</div>
<div class="ltp-bar" id="ltp_top">BANK -- | NIFTY <span id="niftyLtp">--</span> | SENSEX --</div>
<div id="signal" class="signal SELL">LOAD CHART DABAO</div>
<div id="info" style="text-align:center;color:#aaa;font-size:12px">CHART LAST: --</div>

<input id="tokenInput" placeholder="eyJ0... wala token yahan paste karo">
<button id="saveBtn">🟢 SAVE TOKEN & CONNECT KARO</button>

<select id="mainSel">
<option value="NSE_INDEX|Nifty 50">NIFTY 50</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY</option>
<option value="BSE_INDEX|SENSEX">SENSEX</option>
<option value="NSE_EQ|RELIANCE">RELIANCE</option>
<option value="NSE_EQ|TCS">TCS</option>
<option value="NSE_EQ|HDFCBANK">HDFC BANK</option>
<option value="NSE_EQ|ICICIBANK">ICICI BANK</option>
<option value="NSE_EQ|INFY">INFY</option>
<option value="NSE_EQ|SBIN">SBIN</option>
<option value="NSE_EQ|BHARTIARTL">BHARTI AIRTEL</option>
<option value="NSE_EQ|ITC">ITC</option>
<option value="NSE_EQ|LT">L&T</option>
</select>
<select id="intervalSel"><option value="1minute" selected>1M LIVE</option><option value="5minute">5M</option><option value="15minute">15M</option></select>
<button onclick="loadChart()">📊 LOAD CHART</button>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart, candleSeries;

// Chart ko try-catch me taaki button na atke
try{
 chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}}});
 candleSeries=chart.addCandlestickSeries();
}catch(e){console.log("Chart load error",e)}

function setConn(ok,msg){
 let el=document.getElementById('conn');
 el.innerText=msg;
 el.className= ok? 'ok' : '';
 if(!ok) el.id='conn'; else el.className='ok'; el.id='conn';
 if(ok) el.classList.add('ok');
}

if(TOKEN){
 document.getElementById('tokenInput').value=TOKEN;
 setConn(true, "🟢 CONNECTED - Token Save Hai | Auto Live Chal Raha Hai");
 runLTP();
}

// BUTTON KO DIRECT PAKDO - ISSE 100% CONNECTED AYEGA
document.getElementById('saveBtn').onclick = function(){
 let t=document.getElementById('tokenInput').value.trim();
 console.log("Button clicked, token len:",t.length);
 if(t.length < 50){ alert('Bhai token chhota hai, pura paste kar!'); setConn(false,"🔴 Token Galat Hai - Pura Paste Karo"); return; }
 localStorage.setItem('upstox_token',t);
 TOKEN=t;
 setConn(true, "🟢 CONNECTED HO GAYA TOPU! - NIFTY LIVE AA RAHA HAI");
 alert('CONNECTED HO GAYA! Ab upar NIFTY 23146 ayega');
 runLTP();
};

async function runLTP(){
 if(!TOKEN){ setConn(false,"🔴 NOT CONNECTED - Token Daal"); return; }
 try{
  let url='https://api.upstox.com/v2/market-quote/ltp?instrument_key=NSE_INDEX|Nifty 50&instrument_key=NSE_INDEX|Nifty Bank&instrument_key=BSE_INDEX|SENSEX';
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log("LTP API Reply:",j);
  if(j.status==='success' && j.data){
   let nifty=j.data['NSE_INDEX|Nifty 50']?.last_price || '--';
   let bank=j.data['NSE_INDEX|Nifty Bank']?.last_price || '--';
   let sensex=j.data['BSE_INDEX|SENSEX']?.last_price || '--';
   document.getElementById('niftyLtp').innerText=nifty;
   document.getElementById('ltp_top').innerText=`BANK ${bank} LIVE ✓ | NIFTY ${nifty} LIVE ✓ | SENSEX ${sensex} LIVE ✓`;
   setConn(true, `🟢 CONNECTED - NIFTY ${nifty} LIVE`);
  }else{
   setConn(false, "🔴 TOKEN EXPIRE / GALAT - API: "+ (j.message || JSON.stringify(j).slice(0,100)));
   alert("Upstox bol raha hai: "+JSON.stringify(j));
  }
 }catch(e){
  setConn(false,"🔴 NETWORK ERROR - "+e);
  alert("Error: "+e);
 }
}

async function loadChart(){
 if(!TOKEN){alert('Pehle CONNECT karo!');return;}
 let inst=document.getElementById('mainSel').value;
 let interval=document.getElementById('intervalSel').value;
 if(inst.includes('_INDEX')) interval='1minute';
 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(inst)}/${interval}`;
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data && j.data.candles){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData(data);
   chart.timeScale().fitContent();
   let last=data[data.length-1];
   document.getElementById('info').innerText=`CHART LAST: ${last.close} - AB UPAR WALE SE MATCH HOGA`;
  }else{alert('Chart data nahi: '+JSON.stringify(j).slice(0,200))}
 }catch(e){alert(e)}
}
</script>
</body>
</html>
