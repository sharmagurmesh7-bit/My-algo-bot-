<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPU TOWER - FINAL SUPER COMBO</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{background:#111;padding:12px;text-align:center;border-bottom:2px solid #ffcc00}
.header h1{margin:0;color:#ffcc00;font-size:20px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#151515}
.controls div{display:flex;flex-direction:column}
label{font-size:10px;color:#aaa;margin-bottom:2px}
input,select{background:#222;color:#fff;border:1px solid #333;padding:6px;border-radius:4px;font-size:12px}
.live-bar{display:flex;justify-content:space-around;background:#000;padding:10px;border:1px solid #333}
.live-bar div{text-align:center}
.live-bar b{color:#ffcc00;display:block;font-size:12px}
.live-bar span{font-size:18px;font-weight:bold}
#chart{width:100%;height:350px}
.panel{display:flex;gap:10px;padding:15px;justify-content:center}
.btn{padding:15px 30px;font-size:18px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.yes{background:#00c853;color:#fff}
.no{background:#d50000;color:#fff}
.status{text-align:center;padding:10px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="header"><h1>TOPU TOWER - FINAL SUPER COMBO - YAHOO LIVE</h1><div id="conn">CONNECTING...</div></div>

<div class="controls">
<div><label>LIVE SYMBOL</label><select id="symbol">
<option value="^BSESN">SENSEX - ^BSESN</option>
<option value="^NSEI">NIFTY - ^NSEI</option>
<option value="^NSEBANK">BANKNIFTY - ^NSEBANK</option>
<option value="^CNXFIN">FINNIFTY - NIFTY FIN SERVICE</option>
<option value="^NSEMDCP50">MIDCAP - NIFTY MIDCAP 50</option>
</select></div>
<div><label>INDEX</label><select><option>SENSEX</option><option>NIFTY</option></select></div>
<div><label>LOT QTY</label><input id="lot" type="number" value="1"></div>
<div><label>SL POINTS</label><input value="100"></div>
<div><label>TRAILING GAP</label><input value="50"></div>
<div><label>EMA FAST</label><input id="emaF" value="9"></div>
<div><label>EMA MEDIUM</label><input id="emaM" value="21"></div>
<div><label>EMA SLOW</label><input id="emaS" value="50"></div>
<div><label>RSI PERIOD</label><input value="14"></div>
</div>

<div class="live-bar">
<div><b id="symName">^BSESN</b><span id="ltp">0</span></div>
<div><b>DAY OPEN</b><span id="open">0</span></div>
<div><b>EMA TREND</b><span id="emaTrend">WAITING</span></div>
<div><b>CHANGE</b><span id="change">0</span></div>
</div>

<div id="chart"></div>

<div class="panel">
<button class="btn yes">YES (CALL)</button>
<button class="btn no">NO (PUT)</button>
</div>
<div class="status">SENSEX • 1MIN • CANDLESTICK • EMA 9 🟡 21 🔵 50 🟣 • LIVE YAHOO FINANCE - NO DEMO | TRAILING SL MANAGER 02 PM to 03:15</div>
<div class="status">SL: <span id="sl">0</span> | TGT: <span id="tgt">0</span> | LIVE: <span id="liveStatus">WAITING</span></div>

<script>
const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {layout:{background:{color:'#0a0a0a'},textColor:'#fff'},grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}},width:chartEl.clientWidth,height:350,timeScale:{timeVisible:true}});
const candleSeries = chart.addCandlestickSeries();
const ema = (data,p)=>{let k=2/(p+1),arr=[],prev=data[0]?.close||0;data.forEach((d,i)=>{let c=i==0?d.close:d.close*k+prev*(1-k);arr.push({time:d.time,value:c});prev=c});return arr;};
let ema9Series = chart.addLineSeries({color:'#ffeb3b',lineWidth:1});
let ema21Series = chart.addLineSeries({color:'#2196f3',lineWidth:1});
let ema50Series = chart.addLineSeries({color:'#e040fb',lineWidth:1});

async function fetchYahoo(sym){
  try{
    document.getElementById('conn').innerText='CONNECTING YAHOO...';
    // Use proxy to avoid CORS
    let url = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d`)}`;
    let res = await fetch(url);
    let json = await res.json();
    let result = json.chart.result[0];
    let timestamps = result.timestamp;
    let quotes = result.indicators.quote[0];
    let closes = quotes.close;
    let opens = quotes.open;
    let highs = quotes.high;
    let lows = quotes.low;
    let meta = result.meta;

    let candles=[];
    for(let i=0;i<timestamps.length;i++){
      if(!closes[i]) continue;
      candles.push({time:timestamps[i], open:opens[i], high:highs[i], low:lows[i], close:closes[i]});
    }
    candleSeries.setData(candles);
    let ltp = meta.regularMarketPrice;
    let open = meta.chartPreviousClose || meta.previousClose || opens[0];
    document.getElementById('ltp').innerText=ltp.toFixed(2);
    document.getElementById('open').innerText=open.toFixed(2);
    document.getElementById('symName').innerText=sym;
    let chg = ltp-open;
    let chgEl=document.getElementById('change');
    chgEl.innerText=(chg>0?'+':'')+chg.toFixed(2);
    chgEl.style.color=chg>=0?'#00c853':'#d50000';
    document.getElementById('conn').innerText='LIVE CONNECTED - YAHOO';
    document.getElementById('liveStatus').innerText='LIVE - '+new Date().toLocaleTimeString();

    // EMA
    ema9Series.setData(ema(candles,9));
    ema21Series.setData(ema(candles,21));
    ema50Series.setData(ema(candles,50));

    let last = candles[candles.length-1].close;
    let e9 = ema(candles,9).pop().value;
    let e21 = ema(candles,21).pop().value;
    document.getElementById('emaTrend').innerText = last>e9 && e9>e21? 'BULLISH' : last<e9? 'BEARISH' : 'SIDEWAYS';

  }catch(e){
    document.getElementById('conn').innerText='RETRYING... '+e.message;
    console.log(e);
  }
}

let currentSym='^BSESN';
fetchYahoo(currentSym);
setInterval(()=>fetchYahoo(currentSym), 15000); // 15 sec refresh

document.getElementById('symbol').addEventListener('change',(e)=>{
  currentSym=e.target.value;
  fetchYahoo(currentSym);
});
window.addEventListener('resize',()=>chart.timeScale().fitContent());
</script>
</body>
</html>
