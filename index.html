<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - 100 STOCKS LIVE</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:8px}
.header{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px;font-weight:bold}
#conn{padding:10px;text-align:center;border-radius:8px;margin:5px 0;background:#222;color:orange;font-weight:bold}
#conn.ok{background:#00c853;color:#fff}
.ltp-bar{text-align:center;color:#00ff88;border:1px solid #333;padding:8px;border-radius:8px}
input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;box-sizing:border-box}
input,select{background:#111;color:#fff;border:1px solid gold}
button{background:gold;color:#000;font-weight:bold;border:none;cursor:pointer}
#chart{height:420px;border:1px solid #222;border-radius:10px;margin-top:8px}
</style>
</head>

<select id="intervalSel">
<option value="1minute" selected>1M LIVE</option>
<option value="5minute">5M</option>
<option value="15minute">15M</option>
<option value="30minute">30M</option>
<option value="day">1 DAY</option>
</select>

<button onclick="loadChart()">📊 LOAD CHART - SABKA AYEGA</button>
<div id="info" style="text-align:center;color:#aaa;font-size:12px;margin-top:5px">CHART LAST: --</div>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}}});
let candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3d3d'});

let connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.innerText=msg; connEl.className= ok ? 'ok' : ''; }

if(TOKEN){ document.getElementById('tokenInput').value=TOKEN; setConn(true,"🟢 CONNECTED - Auto Live"); runLTP(); }

document.getElementById('saveBtn').onclick=()=>{
 let t=document.getElementById('tokenInput').value.trim();
 if(t.length<50){alert('Pura token paste kar');return}
 localStorage.setItem('upstox_token',t); TOKEN=t;
 setConn(true,"🟢 CONNECTED HO GAYA TOPU!");
 runLTP();
};

async function runLTP(){
 if(!TOKEN) return;
 try{
  let r=await fetch('https://api.upstox.com/v2/market-quote/ltp?instrument_key=NSE_INDEX|Nifty 50&instrument_key=NSE_INDEX|Nifty Bank&instrument_key=BSE_INDEX|SENSEX',{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data){
   let n=j.data['NSE_INDEX|Nifty 50']?.last_price||'--';
   let b=j.data['NSE_INDEX|Nifty Bank']?.last_price||'--';
   let s=j.data['BSE_INDEX|SENSEX']?.last_price||'--';
   document.getElementById('ltp_top').innerText=`BANK ${b} LIVE ✓ | NIFTY ${n} LIVE ✓ | SENSEX ${s} LIVE ✓`;
  }
 }catch(e){}
}

async function loadChart(){
 if(!TOKEN){alert('Pehle CONNECT karo');return}
 let inst=document.getElementById('mainSel').value;
 let interval=document.getElementById('intervalSel').value;
 // INDEX ke liye Upstox sirf 1minute intraday deta hai
 if(inst.includes('INDEX') && interval!='1minute' && interval!='30minute' && interval!='day'){
   interval='1minute';
 }
 // SUNSET naam ka koi real stock nahi, isliye usko RELIANCE se test karenge
 if(inst.includes('SUNSET')){ alert('SUNSET naam ka NSE pe stock nahi hai, isliye RELIANCE ka chart dikha raha hu test ke liye'); inst='NSE_EQ|RELIANCE'; }

 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(inst)}/${interval}`;
 console.log("Chart URL:",url);
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log("Chart Reply:",j);
  if(j.data && j.data.candles && j.data.candles.length>0){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData([]); // double wala bug fix
   candleSeries.setData(data);
   chart.timeScale().fitContent();
   let last=data[data.length-1];
   document.getElementById('info').innerText=`CHART LAST: ${last.close} | ${inst.split('|').pop()} | ${interval}`;
  }else{
   alert('Data nahi mila: '+JSON.stringify(j).slice(0,300));
  }
 }catch(e){alert('Chart Error: '+e)}
}
setInterval(runLTP,5000);
</script>
</body>
