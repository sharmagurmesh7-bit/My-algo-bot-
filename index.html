<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - ISIN FIX</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:8px}
.header{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px;font-weight:bold}
#conn{padding:10px;text-align:center;border-radius:8px;margin:5px 0;background:#222;color:orange;font-weight:bold}
#conn.ok{background:#00c853;color:#fff}
.ltp-bar{text-align:center;color:#00ff88;border:1px solid #333;padding:8px;border-radius:8px}
input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;box-sizing:border-box}
input,select{background:#111;color:#fff;border:1px solid gold}
button{background:gold;color:#000;font-weight:bold;border:none;cursor:pointer}
#chart{height:420px;border:1px solid #222;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="header">🚀 TOPU TOWER - 100 STOCKS ISIN FIX</div>
<div id="conn">🔴 NOT CONNECTED</div>
<div class="ltp-bar" id="ltp_top">BANK -- | NIFTY -- | SENSEX --</div>

<input id="tokenInput" placeholder="Token paste kar">
<button id="saveBtn">🟢 SAVE & CONNECT</button>

<option value="NSE_EQ|INE002A01018">RELIANCE</option>
<option value="NSE_EQ|INE467B01029">TCS</option>
<option value="NSE_EQ|INE040A01034">HDFC BANK</option>
<option value="NSE_EQ|INE090A01021">ICICI BANK</option>
<option value="NSE_EQ|INE009A01021">INFOSYS</option>
<option value="NSE_EQ|INE062A01020">SBIN</option>
<option value="NSE_EQ|INE397D01024">BHARTI AIRTEL</option>
<option value="NSE_EQ|INE154A01025">ITC</option>
<option value="NSE_EQ|INE018A01030">L&T</option>
<option value="NSE_EQ|INE237A01028">KOTAK BANK</option>
<option value="NSE_EQ|INE238A01026">AXIS BANK</option>
<option value="NSE_EQ|INE296A01024">BAJFINANCE</option>
<option value="NSE_EQ|INE585B01010">MARUTI</option>
<option value="NSE_EQ|INE021A01026">ASIANPAINT</option>
<option value="NSE_EQ|INE280A01028">TITAN</option>
<option value="NSE_EQ|INE075A01022">WIPRO</option>
<option value="NSE_EQ|INE481G01011">ULTRACEMCO</option>
<option value="NSE_EQ|INE044A01036">SUNPHARMA</option>
<option value="NSE_EQ|INE155A01022">TATA MOTORS</option>
<option value="NSE_EQ|INE733E01010">NTPC</option>
<option value="NSE_EQ|INE752E01010">POWERGRID</option>
<option value="NSE_EQ|INE213A01029">ONGC</option>
<option value="NSE_EQ|INE019A01038">JSW STEEL</option>
<option value="NSE_EQ|INE081A01020">TATA STEEL</option>
<option value="NSE_EQ|INE038A01020">HINDALCO</option>
<option value="NSE_EQ|INE522F01014">COAL INDIA</option>
<option value="NSE_EQ|INE029A01011">BPCL</option>
<option value="NSE_EQ|INE423A01024">ADANI ENT</option>
<option value="NSE_EQ|INE742F01042">ADANI PORTS</option>
<option value="NSE_EQ|INE002A01018">RELIANCE - TEST</option>
<option value="NSE_EQ|INE242A01010">IOC</option>
<option value="NSE_EQ|INE271C01023">DLF</option>
<option value="NSE_EQ|INE176A01034">HAL</option>
<option value="NSE_EQ|INE028A01039">BOB</option>
<option value="NSE_EQ|INE334X01017">IRCTC</option>
<option value="NSE_EQ|INE646L01027">INDIGO</option>
<option value="NSE_EQ|INE758T01015">ZOMATO</option>
<option value="NSE_EQ|INE192R01011">DMART</option>
<option value="NSE_EQ|INE245A01017">TATA POWER</option>
<option value="NSE_EQ|INE205A01025">VEDL</option>
</select>

<select id="intervalSel">
<option value="1minute" selected>1M LIVE</option>
<option value="5minute">5M</option>
<option value="15minute">15M</option>
<option value="30minute">30M</option>
<option value="day">1 DAY</option>
</select>

<button onclick="loadChart()">📊 LOAD CHART - AB 100% AYEGA</button>
<div id="info" style="text-align:center;color:#aaa;font-size:12px;margin-top:5px">CHART LAST: --</div>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}}});
let candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3d3d'});
let connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.innerText=msg; connEl.className= ok? 'ok' : ''; }

if(TOKEN){ document.getElementById('tokenInput').value=TOKEN; setConn(true,"🟢 CONNECTED - Auto Live"); runLTP(); }

document.getElementById('saveBtn').onclick=()=>{
 let t=document.getElementById('tokenInput').value.trim();
 if(t.length<50){alert('Pura token paste kar');return}
 localStorage.setItem('upstox_token',t); TOKEN=t;
 setConn(true,"🟢 CONNECTED HO GAYA TOPU!");
 runLTP();
};

async function runLTP(){
 if(!TOKEN) return;
 try{
  let r=await fetch('https://api.upstox.com/v2/market-quote/ltp?instrument_key=NSE_INDEX|Nifty 50&instrument_key=NSE_INDEX|Nifty Bank&instrument_key=BSE_INDEX|SENSEX',{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log(j);
  if(j.data){
   let n=j.data['NSE_INDEX|Nifty 50']?.last_price||'--';
   let b=j.data['NSE_INDEX|Nifty Bank']?.last_price||'--';
   let s=j.data['BSE_INDEX|SENSEX']?.last_price||'--';
   document.getElementById('ltp_top').innerText=`BANK ${b} LIVE ✓ | NIFTY ${n} LIVE ✓ | SENSEX ${s} LIVE ✓`;
   setConn(true,`🟢 CONNECTED - NIFTY ${n} LIVE`);
  }else{
   setConn(false,"🔴 TOKEN ERROR: "+JSON.stringify(j).slice(0,120));
  }
 }catch(e){ setConn(false,"🔴 NETWORK ERROR"); }
}

async function loadChart(){
 if(!TOKEN){alert('Pehle CONNECT karo');return}
 let inst=document.getElementById('mainSel').value;
 let interval=document.getElementById('intervalSel').value;
 // INDEX aur STOCK dono ke liye Upstox ab 1minute aur 30minute, day, week, month support karta hai【8100141638110994421†L30-L33】
 if(inst.includes('INDEX') && interval!=='1minute' && interval!=='30minute' && interval!=='day'){
   interval='1minute';
 }
 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(inst)}/${interval}`;
 console.log("Fetching:",url);
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log("Chart Reply:",j);
  if(j.data && j.data.candles && j.data.candles.length>0){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData([]); // double bug fix
   candleSeries.setData(data);
   chart.timeScale().fitContent();
   let last=data[data.length-1];
   document.getElementById('info').innerText=`CHART LAST: ${last.close} | ${inst.split('|').pop()} | ${interval} | Candle: ${data.length}`;
  }else{
   alert('Data nahi mila: '+JSON.stringify(j).slice(0,400));
  }
 }catch(e){alert('Chart Error: '+e)}
}
setInterval(runLTP,5000);
</script>
</body>
</html>
