<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - FINAL UPSTOX</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{background:#111;padding:12px;text-align:center;border-bottom:3px solid gold}
#ltp{font-size:36px;color:#00ff00;font-weight:bold}
#stat{font-size:12px;color:#aaa}
.box{background:#1a1a1a;margin:12px;padding:12px;border-radius:12px;border:1px solid #333}
input{width:92%;padding:12px;background:#000;color:#0f0;border:1px solid gold;border-radius:8px;font-size:12px}
.btn{width:100%;padding:14px;background:gold;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:10px;font-size:16px}
#tv{height:450px;margin-top:10px}
</style>
</head>
<body>
<div class="top">
<h2 style="margin:0;color:gold">TOPU TOWER - UPSTOX LIVE</h2>
<div id="ltp">TOKEN DALO...</div>
<div id="stat">Waiting...</div>
</div>

<div class="box" id="loginBox">
<h3 style="color:gold;margin:0 0 6px 0">🔐 Token Paste Karo</h3>
<input id="tokenInput" placeholder="eyJ0eXAiOiJKV1... wala pura token yaha paste karo">
<button class="btn" onclick="saveAndStart()">SAVE & START TOWER</button>
<button class="btn" style="background:#333;color:#fff;margin-top:6px" onclick="clearToken()">TOKEN DELETE</button>
</div>

<div class="box">
<div style="display:flex;gap:6px">
<select id="symSel" onchange="changeSym()" style="flex:1;padding:10px;background:#222;color:#fff;border:1px solid #444;border-radius:6px">
<option value="BSE_INDEX|SENSEX">SENSEX</option>
<option value="NSE_INDEX|Nifty 50">NIFTY 50</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY</option>
<option value="NSE_INDEX|Nifty Fin Service">FIN NIFTY</option>
</select>
<button onclick="startLive()" style="padding:10px;background:#00c853;color:#fff;border:none;border-radius:6px;font-weight:bold">RESTART</button>
</div>
</div>

<div id="tv"></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
let TOKEN = localStorage.getItem('TOPU_UPSTOX_TOKEN') || '';
let CURRENT_SYMBOL = localStorage.getItem('TOPU_SYMBOL') || 'BSE_INDEX|SENSEX';
document.getElementById('symSel').value = CURRENT_SYMBOL;
document.getElementById('tokenInput').value = TOKEN;

if(TOKEN){
  document.getElementById('loginBox').style.display='none';
  startLive();
}

function saveAndStart(){
  let t = document.getElementById('tokenInput').value.trim();
  if(t.length < 20){ alert('Bhai sahi token paste kar!'); return; }
  localStorage.setItem('TOPU_UPSTOX_TOKEN', t);
  TOKEN = t;
  document.getElementById('loginBox').style.display='none';
  startLive();
}
function clearToken(){
  localStorage.removeItem('TOPU_UPSTOX_TOKEN');
  location.reload();
}
function changeSym(){
  CURRENT_SYMBOL = document.getElementById('symSel').value;
  localStorage.setItem('TOPU_SYMBOL', CURRENT_SYMBOL);
  startLive();
}

let intervalId = null;
function startLive(){
  if(intervalId) clearInterval(intervalId);

  // 1. TradingView Chart Load
  let tvSym = CURRENT_SYMBOL.includes('SENSEX')? 'BSE:SENSEX' : CURRENT_SYMBOL.includes('Bank')? 'NSE:BANKNIFTY' : CURRENT_SYMBOL.includes('Fin')? 'NSE:FINNIFTY' : 'NSE:NIFTY';
  document.getElementById('tv').innerHTML='';
  new TradingView.widget({
    "autosize": true, "symbol": tvSym, "interval": "1",
    "timezone": "Asia/Kolkata", "theme": "dark", "style": "1",
    "container_id": "tv", "studies": ["EMA 9","EMA 21"]
  });

  document.getElementById('stat').innerText = 'Connecting... ' + CURRENT_SYMBOL;

  // 2. LIVE Price Fetch
  fetchPrice(); // first time instant
  intervalId = setInterval(fetchPrice, 1500); // har 1.5 sec
}

async function fetchPrice(){
  try{
    let instrument = encodeURIComponent(CURRENT_SYMBOL);
    let url = `https://api.upstox.com/v2/market-quote/ltp?instrument_key=${instrument}`;
    let res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/json' }
    });
    let json = await res.json();
    console.log(json);

    if(json.status === 'success'){
      let keys = Object.keys(json.data);
      if(keys.length > 0){
        let ltp = json.data[keys[0]].last_price;
        document.getElementById('ltp').innerText = keys[0] + ' : ' + ltp;
        document.getElementById('stat').innerText = 'LIVE ✓ ' + new Date().toLocaleTimeString() + ' | TOWER SYNC OK';
      }
    } else if(json.errors){
      document.getElementById('stat').innerText = 'TOKEN EXPIRE: ' + JSON.stringify(json.errors).slice(0,80);
      document.getElementById('ltp').innerText = 'TOKEN EXPIRE - NAYA DALO';
      document.getElementById('loginBox').style.display='block';
    } else {
      document.getElementById('stat').innerText = JSON.stringify(json).slice(0,120);
    }
  } catch(e){
    document.getElementById('stat').innerText = 'Error: ' + e.message + ' (CORS issue to thoda wait karo)';
  }
}
</script>
</body>
</html>
