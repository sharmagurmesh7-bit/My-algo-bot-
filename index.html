<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - VALUE CHANGE</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:8px}
.header{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px;font-weight:bold}
#conn{padding:10px;text-align:center;border-radius:8px;margin:5px 0;background:#222;color:orange;font-weight:bold}
#conn.ok{background:#00c853;color:#fff}
.ltp-bar{text-align:center;color:#00ff88;border:1px solid #333;padding:8px;border-radius:8px;font-size:12px}
.signal{padding:14px;text-align:center;font-weight:bold;border-radius:8px;margin:8px 0;font-size:16px}
.BUY{background:#ff1744}.SELL{background:#00c853}.HOLD{background:#333}
.setting{background:#111;border:1px solid gold;border-radius:10px;padding:10px;margin:8px 0}
.setting h3{color:gold;margin:0 0 8px 0;text-align:center;font-size:14px}
.row{display:flex;gap:6px;margin:4px 0}
.row label{flex:1;font-size:12px;color:#aaa}
.row input{flex:1;padding:8px;background:#000;color:#fff;border:1px solid #333;border-radius:6px}
.indi{display:flex;gap:5px;margin:5px 0}
.indi div{flex:1;background:#111;border:1px solid #222;padding:8px;border-radius:6px;text-align:center;font-size:11px}
.indi b{color:gold}
input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;box-sizing:border-box}
select{background:#111;color:#fff;border:1px solid gold}
button{background:gold;color:#000;font-weight:bold;border:none;cursor:pointer}
#chart{height:400px;border:1px solid #222;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="header">🚀 TOPU TOWER - EMA VALUE CHANGE SYSTEM</div>
<div id="conn">🔴 NOT CONNECTED</div>
<div class="ltp-bar" id="ltp_top">BANK -- | NIFTY -- | SENSEX --</div>

<div id="signal" class="signal HOLD">LOAD CHART DABAO - SIGNAL AYEGA</div>

<!-- EMA VALUE CHANGE KA SYSTEM WAPAS -->
<div class="setting">
<h3>⚙️ INDICATOR VALUE CHANGE - YAHAN SE BADHAO GHATAO</h3>
<div class="row">
<label>EMA Fast (Index=9, Stock=20)</label>
<input id="emaFastInput" type="number" value="9">
</div>
<div class="row">
<label>EMA Slow (Index=21, Stock=50)</label>
<input id="emaSlowInput" type="number" value="21">
</div>
<div class="row">
<label>EMA Long (Stock=100/200)</label>
<input id="emaLongInput" type="number" value="50">
</div>
<div class="row">
<label>RSI Period (Default 14)</label>
<input id="rsiInput" type="number" value="14">
</div>
<button onclick="loadChart()" style="background:#00ff88;margin-top:8px">✅ VALUE SET KARO & CHART RELOAD</button>
</div>

<div class="indi">
<div>EMA <span id="labelFast">9</span><br><b id="ema9">--</b></div>
<div>EMA <span id="labelSlow">21</span><br><b id="ema21">--</b></div>
<div>EMA <span id="labelLong">50</span><br><b id="emaLong">--</b></div>
<div>RSI <span id="labelRsi">14</span><br><b id="rsi">--</b></div>
</div>

<input id="tokenInput" placeholder="Token paste kar" style="background:#111;color:#fff;border:1px solid gold;padding:12px;border-radius:8px;width:100%;box-sizing:border-box">
<button id="saveBtn">🟢 SAVE & CONNECT</button>

<select id="mainSel">
<option value="NSE_INDEX|Nifty 50">NIFTY 50 - INDEX</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY - INDEX</option>
<option value="BSE_INDEX|SENSEX">SENSEX - INDEX</option>
<option value="NSE_INDEX|Nifty Fin Service">FINNIFTY - INDEX</option>
<option value="NSE_EQ|INE002A01018">RELIANCE - STOCK</option>
<option value="NSE_EQ|INE467B01029">TCS - STOCK</option>
<option value="NSE_EQ|INE040A01034">HDFC BANK - STOCK</option>
<option value="NSE_EQ|INE090A01021">ICICI BANK - STOCK</option>
<option value="NSE_EQ|INE009A01021">INFY - STOCK</option>
<option value="NSE_EQ|INE062A01020">SBIN - STOCK</option>
<option value="NSE_EQ|INE397D01024">BHARTI AIRTEL</option>
<option value="NSE_EQ|INE154A01025">ITC</option>
<option value="NSE_EQ|INE758T01015">ZOMATO</option>
<option value="NSE_EQ|INE192R01011">DMART</option>
</select>

<button onclick="loadChart()">📊 LOAD CHART + SIGNAL</button>
<div id="info" style="text-align:center;color:#aaa;font-size:12px;margin-top:5px">CHART LAST: --</div>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}}});
let candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3d3d'});
let emaFastSeries=chart.addLineSeries({color:'yellow',lineWidth:1});
let emaSlowSeries=chart.addLineSeries({color:'cyan',lineWidth:1});
let emaLongSeries=chart.addLineSeries({color:'orange',lineWidth:1});

let connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.innerText=msg; connEl.className= ok? 'ok':''; }

if(TOKEN){ document.getElementById('tokenInput').value=TOKEN; setConn(true,"🟢 CONNECTED - Auto Live"); runLTP(); }

document.getElementById('saveBtn').onclick=()=>{
 let t=document.getElementById('tokenInput').value.trim();
 if(t.length<50){alert('Pura token paste kar');return}
 localStorage.setItem('upstox_token',t); TOKEN=t;
 setConn(true,"🟢 CONNECTED HO GAYA TOPU!"); runLTP();
};

async function runLTP(){
 if(!TOKEN) return;
 try{
  let keys = ['NSE_INDEX|Nifty 50','NSE_INDEX|Nifty Bank','BSE_INDEX|SENSEX'].map(k=>`instrument_key=${encodeURIComponent(k)}`).join('&');
  let url=`https://api.upstox.com/v2/market-quote/ltp?${keys}`;
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data){
   let n=j.data['NSE_INDEX|Nifty 50']?.last_price||'--';
   let b=j.data['NSE_INDEX|Nifty Bank']?.last_price||'--';
   let s=j.data['BSE_INDEX|SENSEX']?.last_price||'--';
   document.getElementById('ltp_top').innerText=`BANK ${b} ✓ | NIFTY ${n} ✓ | SENSEX ${s} ✓`;
  }
 }catch(e){}
}

function calcEMA(data, period){
 if(data.length < period) return [];
 let k=2/(period+1); let ema=[]; let sum=0;
 for(let i=0;i<data.length;i++){
  if(i<period-1){ sum+=data[i].close; ema.push(null); }
  else if(i===period-1){ sum+=data[i].close; ema.push(sum/period); }
  else{ ema.push(data[i].close*k + ema[i-1]*(1-k)); }
 }
 return ema;
}
function calcRSI(data, period=14){
 let rsi=[]; if(data.length<=period) return rsi;
 let gains=0, losses=0;
 for(let i=1;i<=period;i++){ let d=data[i].close-data[i-1].close; if(d>=0) gains+=d; else losses-=d; }
 let avgGain=gains/period, avgLoss=losses/period;
 rsi[period]= avgLoss===0? 100 : 100-(100/(1+avgGain/avgLoss));
 for(let i=period+1;i<data.length;i++){
  let d=data[i].close-data[i-1].close; let gain=d>0?d:0, loss=d<0?-d:0;
  avgGain=(avgGain*(period-1)+gain)/period; avgLoss=(avgLoss*(period-1)+loss)/period;
  rsi[i]= avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
 }
 return rsi;
}

async function loadChart(){
 if(!TOKEN){alert('Pehle CONNECT karo');return}

 // YAHAN SE VALUE CHANGE HOGI
 let fast = parseInt(document.getElementById('emaFastInput').value) || 9;
 let slow = parseInt(document.getElementById('emaSlowInput').value) || 21;
 let long = parseInt(document.getElementById('emaLongInput').value) || 50;
 let rsiPeriod = parseInt(document.getElementById('rsiInput').value) || 14;

 document.getElementById('labelFast').innerText=fast;
 document.getElementById('labelSlow').innerText=slow;
 document.getElementById('labelLong').innerText=long;
 document.getElementById('labelRsi').innerText=rsiPeriod;

 let inst=document.getElementById('mainSel').value;
 let name=document.getElementById('mainSel').selectedOptions[0].text;
 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(inst)}/1minute`;

 document.getElementById('info').innerText=`Loading ${name} with EMA ${fast}/${slow}/${long}...`;
 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data && j.data.candles && j.data.candles.length>0){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData([]); emaFastSeries.setData([]); emaSlowSeries.setData([]); emaLongSeries.setData([]);
   candleSeries.setData(data);
   chart.timeScale().fitContent();

   let emaF=calcEMA(data,fast);
   let emaS=calcEMA(data,slow);
   let emaL=calcEMA(data,long);
   let rsi=calcRSI(data,rsiPeriod);

   let lineF=[], lineS=[], lineL=[];
   for(let i=0;i<data.length;i++){
    if(emaF[i]) lineF.push({time:data[i].time,value:emaF[i]});
    if(emaS[i]) lineS.push({time:data[i].time,value:emaS[i]});
    if(emaL[i]) lineL.push({time:data[i].time,value:emaL[i]});
   }
   emaFastSeries.setData(lineF);
   emaSlowSeries.setData(lineS);
   emaLongSeries.setData(lineL);

   let last=data[data.length-1];
   let lf=emaF[data.length-1], ls=emaS[data.length-1], ll=emaL[data.length-1], lr=rsi[data.length-1];

   document.getElementById('ema9').innerText=lf?lf.toFixed(2):'--';
   document.getElementById('ema21').innerText=ls?ls.toFixed(2):'--';
   document.getElementById('emaLong').innerText=ll?ll.toFixed(2):'--';
   document.getElementById('rsi').innerText=lr?lr.toFixed(1):'--';
   document.getElementById('info').innerText=`LAST: ${last.close} | EMA ${fast}/${slow}/${long} | RSI ${lr?.toFixed(1)} | ${name}`;

   let sigEl=document.getElementById('signal');
   if(lf && ls){
    if(lf > ls && lf > ll && lr < 70){
     sigEl.className='signal BUY';
     sigEl.innerText=`🚀 BUY - ${name} - EMA ${fast}>${slow}>${long} | RSI ${lr.toFixed(0)}`;
    }else if(lf < ls){
     sigEl.className='signal SELL';
     sigEl.innerText=`🔻 SELL - ${name} - EMA ${fast}<${slow} | RSI ${lr.toFixed(0)}`;
    }else{
     sigEl.className='signal HOLD';
     sigEl.innerText=`⏸️ HOLD - ${name} - Sideways | RSI ${lr?.toFixed(0)}`;
    }
   }
  }else{ alert('Data nahi: '+JSON.stringify(j).slice(0,400)); }
 }catch(e){ alert('Error: '+e); }
}
setInterval(runLTP,5000);
</script>
</body>
</html>
