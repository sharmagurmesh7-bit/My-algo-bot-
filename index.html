<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPU TOWER - OPTION PREMIUM</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:6px}
.header{text-align:center;color:gold;border:2px solid gold;padding:10px;border-radius:10px;font-weight:bold}
#conn{padding:8px;text-align:center;border-radius:8px;margin:5px 0;background:#222;color:orange}
#conn.ok{background:#00c853;color:#fff}
.ltp-bar{text-align:center;color:#00ff88;border:1px solid #333;padding:6px;border-radius:8px;font-size:12px}
.chainBox{background:#111;border:1px solid #333;border-radius:10px;padding:8px;margin:8px 0;max-height:300px;overflow:auto}
.strikeRow{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #222;font-size:13px}
.strikeRow:hover{background:#1a1a1a}
.ce{color:#00ff88}.pe{color:#ff3d3d}
.selected{background:gold!important;color:#000!important;font-weight:bold}
.signal{padding:12px;text-align:center;font-weight:bold;border-radius:8px;margin:6px 0}
.BUY{background:#ff1744}.SELL{background:#00c853}.HOLD{background:#333}
.orderBox{background:#0a0a0a;border:2px solid #00ff88;border-radius:12px;padding:10px;margin:8px 0}
.orderBtns{display:flex;gap:8px}
.orderBtns button{flex:1;padding:12px;font-weight:bold;border-radius:8px;border:none}
.btnBuy{background:#00c853;color:#fff}.btnSell{background:#ff1744;color:#fff}
input,select,button{width:100%;padding:10px;margin:4px 0;border-radius:8px;box-sizing:border-box}
select,input{background:#111;color:#fff;border:1px solid gold}
#chart{height:350px;border:1px solid #222;border-radius:10px}
</style>
</head>
<body>
<div class="header">🚀 TOPU TOWER - OPTION PREMIUM LTP + CHAIN</div>
<div id="conn">🔴 NOT CONNECTED</div>
<div class="ltp-bar" id="ltp_top">NIFTY -- | BANK -- | SENSEX --</div>

<input id="tokenInput" placeholder="Token paste kar (Market + Order)">
<button id="saveBtn">🟢 SAVE & CONNECT</button>

<div style="display:flex;gap:5px">
<select id="indexSel">
<option value="NSE_INDEX|Nifty 50">NIFTY 50</option>
<option value="NSE_INDEX|Nifty Bank">BANK NIFTY</option>
<option value="NSE_INDEX|Nifty Fin Service">FINNIFTY</option>
<option value="BSE_INDEX|SENSEX">SENSEX</option>
</select>
<input id="expiryInput" type="date" style="flex:1">
</div>

<button onclick="loadChain()">📈 OPTION CHAIN LOAD KARO - PREMIUM DIKHEGA</button>

<div id="chain" class="chainBox">
<div style="text-align:center;color:#aaa">Expiry select karke Chain Load karo<br>Premium LTP ayega - ₹50, ₹20 jaisa</div>
</div>

<div id="selectedInfo" style="text-align:center;color:gold;padding:8px;border:1px dashed gold;border-radius:8px;margin:5px 0">Koi Option Select Nahi - Chain se CE/PE dabao</div>

<div id="signal" class="signal HOLD">PREMIUM CHART KA SIGNAL YAHAN AYEGA</div>

<div class="orderBox">
<h3 style="color:#00ff88;text-align:center;margin:0 0 6px 0">🎮 PREMIUM ORDER - CONTROL TERE HAATH ME</h3>
<div style="display:flex;gap:5px">
<input id="qty" type="number" value="1" placeholder="Qty/Lot">
<select id="product"><option value="I">Intraday</option><option value="D">Delivery</option></select>
</div>
<div class="orderBtns">
<button class="btnBuy" onclick="placeOrder('BUY')">🚀 BUY PREMIUM</button>
<button class="btnSell" onclick="placeOrder('SELL')">🔻 SELL PREMIUM</button>
</div>
<div id="orderStatus" style="text-align:center;color:gold;font-size:11px;margin-top:6px">Ready</div>
</div>

<button onclick="loadPremiumChart()">📊 PREMIUM KA CHART LOAD KARO - ₹50 WALA CHART</button>
<div id="chart"></div>

<script>
let TOKEN=localStorage.getItem('upstox_token')||'';
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}}});
let candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff3d3d'});

let connEl=document.getElementById('conn');
function setConn(ok,msg){connEl.innerText=msg; connEl.className=ok?'ok':''}
if(TOKEN){document.getElementById('tokenInput').value=TOKEN; setConn(true,"🟢 CONNECTED"); runLTP();}

document.getElementById('saveBtn').onclick=()=>{
 let t=document.getElementById('tokenInput').value.trim();
 if(t.length<50){alert('Pura token');return}
 localStorage.setItem('upstox_token',t); TOKEN=t; setConn(true,"🟢 CONNECTED - PREMIUM READY"); runLTP();
};

async function runLTP(){
 if(!TOKEN) return;
 try{
  let keys=['NSE_INDEX|Nifty 50','NSE_INDEX|Nifty Bank','BSE_INDEX|SENSEX'].map(k=>`instrument_key=${encodeURIComponent(k)}`).join('&');
  let r=await fetch(`https://api.upstox.com/v2/market-quote/ltp?${keys}`,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  if(j.data){
   document.getElementById('ltp_top').innerText=`NIFTY ${j.data['NSE_INDEX|Nifty 50']?.last_price||'--'} | BANK ${j.data['NSE_INDEX|Nifty Bank']?.last_price||'--'} | SENSEX ${j.data['BSE_INDEX|SENSEX']?.last_price||'--'}`;
  }
 }catch(e){}
}

let selectedInstrument=null;
let selectedPremium=0;
let selectedName='';

// AUTO EXPIRY - Is Thursday
(function setExpiry(){
 let d=new Date(); let day=d.getDay(); let diff=(4-day+7)%7; if(diff===0) diff=7; d.setDate(d.getDate()+diff);
 document.getElementById('expiryInput').valueAsDate=d;
})();

async function loadChain(){
 if(!TOKEN){alert('Token dalo');return}
 let index=document.getElementById('indexSel').value;
 let expiry=document.getElementById('expiryInput').value;
 if(!expiry){alert('Expiry date dalo');return}

 document.getElementById('chain').innerHTML='<div style="text-align:center">Loading Chain... Premium LTP la raha hu...</div>';

 try{
  let url=`https://api.upstox.com/v2/option/chain?instrument_key=${encodeURIComponent(index)}&expiry_date=${expiry}`;
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log("Chain:",j);
  if(!j.data || j.data.length===0){ document.getElementById('chain').innerHTML='Chain nahi mila - Expiry galat hai, Thursday ki date dalo'; return; }

  // ATM ke aas paas 10 strikes dikhao
  let niftyLTP = j.data[0]?.strike_price? 0 : 0;
  // Nifty LTP leke ATM nikalo
  try{
   let ltpR=await fetch(`https://api.upstox.com/v2/market-quote/ltp?instrument_key=${encodeURIComponent(index)}`,{headers:{'Authorization':'Bearer '+TOKEN}});
   let ltpJ=await ltpR.json();
   niftyLTP=ltpJ.data[index]?.last_price||24500;
  }catch(e){ niftyLTP=24500; }

  let atm=Math.round(niftyLTP/50)*50;
  let filtered=j.data.filter(o=> Math.abs(o.strike_price-atm) <= 500).slice(0,20);

  let html=`<div style="display:flex;font-weight:bold;color:gold;padding:6px;border-bottom:1px solid gold"><span style="flex:1">CE PREMIUM</span><span style="flex:1;text-align:center">STRIKE</span><span style="flex:1;text-align:right">PE PREMIUM</span></div>`;

  filtered.forEach(item=>{
   let ceLtp=item.call_options?.market_data?.ltp||0;
   let peLtp=item.put_options?.market_data?.ltp||0;
   let ceToken=item.call_options?.instrument_key||'';
   let peToken=item.put_options?.instrument_key||'';

   html+=`<div class="strikeRow">
    <span class="ce" onclick="selectOption('${ceToken}','${item.strike_price} CE ₹${ceLtp}','${ceLtp}')" style="flex:1;cursor:pointer">📈 ${ceLtp.toFixed(1)} ₹ - CE</span>
    <span style="flex:1;text-align:center;font-weight:bold;color:#fff">${item.strike_price}</span>
    <span class="pe" onclick="selectOption('${peToken}','${item.strike_price} PE ₹${peLtp}','${peLtp}')" style="flex:1;text-align:right;cursor:pointer">PE - ₹${peLtp.toFixed(1)} 📉</span>
   </div>`;
  });

  html+=`<div style="text-align:center;color:#aaa;font-size:11px;margin-top:6px">CE pe click karo to ₹50 wala CE premium select hoga, PE pe click karo to PE premium</div>`;
  document.getElementById('chain').innerHTML=html;

 }catch(e){
  document.getElementById('chain').innerHTML='Error: '+e;
 }
}

function selectOption(token, name, premium){
 if(!token){alert('Is strike ka premium nahi hai');return}
 selectedInstrument=token;
 selectedPremium=parseFloat(premium);
 selectedName=name;
 document.getElementById('selectedInfo').innerHTML=`✅ SELECTED: <b>${name}</b><br>Instrument: ${token}<br>Premium LTP: ₹${premium} - Iska chart aur order lagega`;
 document.getElementById('orderStatus').innerText=`Ready: ${name} - Premium ₹${premium} - Qty se order lagega`;

 // Auto chart load
 loadPremiumChart();
}

async function loadPremiumChart(){
 if(!selectedInstrument){alert('Pehle Chain se CE ya PE ka Premium select karo - ₹50 wala');return}
 if(!TOKEN){alert('Token dalo');return}

 let url=`https://api.upstox.com/v2/historical-candle/intraday/${encodeURIComponent(selectedInstrument)}/1minute`;

 document.getElementById('signal').innerText=`Loading ${selectedName} Premium Chart... ₹${selectedPremium} wala`;

 try{
  let r=await fetch(url,{headers:{'Authorization':'Bearer '+TOKEN}});
  let j=await r.json();
  console.log("Premium Chart:",j);
  if(j.data && j.data.candles && j.data.candles.length>0){
   let data=j.data.candles.reverse().map(c=>({time:new Date(c[0]).getTime()/1000,open:c[1],high:c[2],low:c[3],close:c[4]}));
   candleSeries.setData(data);
   chart.timeScale().fitContent();
   let last=data[data.length-1];
   document.getElementById('signal').className='signal BUY';
   document.getElementById('signal').innerText=`🚀 PREMIUM CHART: ${selectedName} - LAST PREMIUM ₹${last.close} | Abhi ka Premium: ₹${selectedPremium}`;
  }else{
   document.getElementById('signal').innerText=`No chart data: ${JSON.stringify(j).slice(0,200)}`;
  }
 }catch(e){ alert(e); }
}

async function placeOrder(side){
 if(!selectedInstrument){alert('Pehle Chain se Premium select karo');return}
 if(!TOKEN){alert('Token dalo');return}
 let qty=parseInt(document.getElementById('qty').value)||1;
 if(!confirm(`${side} ${selectedName} @ Premium ₹${selectedPremium} Qty ${qty}?`)) return;

 document.getElementById('orderStatus').innerText=`Placing ${side} ${selectedName}...`;

 let body={
  quantity: qty,
  product: document.getElementById('product').value,
  validity: "DAY",
  price: 0,
  tag: "TOPU_PREMIUM",
  instrument_token: selectedInstrument,
  order_type: "MARKET",
  transaction_type: side,
  disclosed_quantity: 0,
  trigger_price: 0,
  is_amo: false
 };

 try{
  let r=await fetch('https://api.upstox.com/v2/order/place',{
   method:'POST',
   headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},
   body: JSON.stringify(body)
  });
  let j=await r.json();
  console.log(j);
  if(j.status==='success' || j.data?.order_id){
   document.getElementById('orderStatus').innerText=`✅ ORDER SUCCESS ID: ${j.data.order_id} - ${selectedName} @ ₹${selectedPremium}`;
   alert(`Order Lag Gaya Topu! ${selectedName} @ ₹${selectedPremium} ID: ${j.data.order_id}`);
  }else{
   document.getElementById('orderStatus').innerText=`❌ FAIL: ${JSON.stringify(j).slice(0,250)}`;
   alert(JSON.stringify(j));
  }
 }catch(e){ document.getElementById('orderStatus').innerText=`❌ ERROR ${e}`; }
}

setInterval(runLTP,5000);
</script>
</body>
</html>
